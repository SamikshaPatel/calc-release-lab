name: Build (DEV and release candidates)

on:
  push:
    branches: [develop, 'release/**']
  workflow_dispatch:

env:
  APP_NAME: calc-release-lab

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      artifact: ${{ steps.meta.outputs.artifact }}
      short_sha: ${{ steps.meta.outputs.short_sha }}
      kind: ${{ steps.meta.outputs.kind }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed to count commits on release branches

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Compute build version
        id: meta
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          if [[ "$GITHUB_REF" == refs/heads/release/* ]]; then
            REL="${GITHUB_REF#refs/heads/release/}"          # e.g. 1.0
            if [[ ! "$REL" =~ ^[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Release branches must be named release/<major>.<minor>, e.g. release/1.0"
              exit 1
            fi
            BASE="${REL}.0"
            git fetch origin develop --quiet
            MERGE_BASE=$(git merge-base HEAD origin/develop)
            N=$(( $(git rev-list --count "${MERGE_BASE}..HEAD") + 1 ))
            VERSION="${BASE}-rc.${N}+${SHORT_SHA}"
            ARTIFACT="${APP_NAME}-${BASE}-rc.${N}-${SHORT_SHA}"
            KIND=release
          else
            BASE=$(node -p "require('./package.json').version")
            VERSION="${BASE}-dev.${GITHUB_RUN_NUMBER}+${SHORT_SHA}"
            ARTIFACT="${APP_NAME}-${BASE}-dev.${GITHUB_RUN_NUMBER}-${SHORT_SHA}"
            KIND=dev
          fi
          {
            echo "version=${VERSION}"
            echo "artifact=${ARTIFACT}"
            echo "short_sha=${SHORT_SHA}"
            echo "kind=${KIND}"
          } >> "$GITHUB_OUTPUT"
          echo "Build version: ${VERSION} (${KIND})"

      - run: npm ci
      - run: npm run lint
      - run: npm test

      - name: Build
        run: npm run build
        env:
          VITE_APP_VERSION: ${{ steps.meta.outputs.version }}
          VITE_COMMIT_SHA: ${{ steps.meta.outputs.short_sha }}

      - name: Write version.json into the build
        run: |
          cat > dist/version.json <<JSON
          {
            "app": "${APP_NAME}",
            "version": "${{ steps.meta.outputs.version }}",
            "commit": "${GITHUB_SHA}",
            "buildNumber": "${GITHUB_RUN_NUMBER}",
            "builtAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          JSON

      - name: Bundle API functions into the build
        run: npm run build:api

      - name: Save build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact }}
          path: dist
          retention-days: 30

      - name: Release candidate summary
        if: steps.meta.outputs.kind == 'release'
        run: |
          {
            echo "### Release candidate built (not deployed)"
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| Version | ${{ steps.meta.outputs.version }} |"
            echo "| Commit | ${GITHUB_SHA} |"
            echo "| Next step | Deploy to QA with this commit SHA for retest |"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-dev:
    needs: build
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment:
      name: dev
      url: https://calc-release-lab-dev.pages.dev
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: dist

      - name: Deploy to Cloudflare Pages (DEV)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=calc-release-lab-dev --branch=main --commit-hash=${{ github.sha }}

      - name: Verify DEV is serving this build
        run: |
          for i in $(seq 1 10); do
            LIVE=$(curl -s https://calc-release-lab-dev.pages.dev/api/health | grep -o '[a-f0-9]\{40\}' | head -1 || true)
            if [ "$LIVE" = "${GITHUB_SHA}" ]; then
              echo "DEV is serving ${{ needs.build.outputs.version }}"
              exit 0
            fi
            echo "Attempt $i: DEV shows '${LIVE}', waiting..."
            sleep 6
          done
          echo "::error::DEV is not serving commit ${GITHUB_SHA}"
          exit 1

      - name: Deployment summary
        run: |
          {
            echo "### Deployed to DEV"
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| Version | ${{ needs.build.outputs.version }} |"
            echo "| Artifact | ${{ needs.build.outputs.artifact }} |"
            echo "| URL | https://calc-release-lab-dev.pages.dev |"
          } >> "$GITHUB_STEP_SUMMARY"
